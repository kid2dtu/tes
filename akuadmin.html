<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Admin Dashboard - Anime Gacha</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #161e31;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 16px; }
    .container { max-width: 520px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 20px; font-weight: 800; }
    .header p { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .form-group { display: flex; gap: 8px; }
    input { flex: 1; padding: 12px 14px; background: #090d16; border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
    button { padding: 12px 18px; background: var(--primary); border: none; border-radius: 10px; color: #fff; font-weight: 700; cursor: pointer; white-space: nowrap; }
    button:disabled { opacity: 0.6; }
    .user-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .user-row { display: flex; justify-content: space-between; align-items: center; background: #090d16; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); }
    .user-info strong { font-size: 14px; }
    .user-info small { color: var(--muted); display: block; font-size: 11px; margin-top: 2px; }
    .actions { display: flex; gap: 6px; }
    .btn-sm { padding: 6px 10px; font-size: 11px; border-radius: 6px; background: rgba(255,255,255,0.08); border: 1px solid var(--border); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; border: 1px solid var(--border); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 12px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛠️ Admin Maintenance</h1>
      <p>Kelola data akun dan tiket Google Sheets</p>
    </div>

    <!-- Login PIN Admin -->
    <div id="loginCard" class="card">
      <div class="form-group">
        <input type="password" id="pinInput" maxlength="4" placeholder="Masukkan PIN Admin (9999)">
        <button id="btnLogin">Masuk</button>
      </div>
    </div>

    <!-- Kontrol Admin -->
    <div id="adminCard" class="card" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span style="font-size: 13px; font-weight: 700;">Daftar Akun Terdaftar</span>
        <button id="btnRefresh" class="btn-sm" style="background: var(--primary);">Refresh</button>
      </div>
      <div id="userList" class="user-list"></div>
      <button id="btnLogout" style="width: 100%; margin-top: 16px; background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3);">Keluar Admin</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const APPS_SCRIPT_URL = "[URL Web App](https://script.google.com/macros/s/AKfycbz3LraveIpKMeajlIpnf5KcG4vGffBtdkY9LtFucyhwbTUVEWPKWLW8vDlwdVbmJ0REMg/exec)".replace(/\[.*?\]\(\vert{}\)/g, "");
    let adminPin = localStorage.getItem('admin_pin') || '';

    window.addEventListener('DOMContentLoaded', () => {
      if (adminPin) {
        loadUsers();
      }
    });

    document.getElementById('btnLogin').addEventListener('click', () => {
      const pin = document.getElementById('pinInput').value.trim();
      if (!pin) return showToast('Ketik PIN Admin');
      adminPin = pin;
      loadUsers();
    });

    document.getElementById('btnRefresh').addEventListener('click', loadUsers);
    document.getElementById('btnLogout').addEventListener('click', () => {
      localStorage.removeItem('admin_pin');
      adminPin = '';
      location.reload();
    });

    async function loadUsers() {
      const list = document.getElementById('userList');
      list.innerHTML = '<p style="font-size:12px; color:var(--muted); text-align:center;">Memuat data...</p>';

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'admin_get_users', adminPin })
        });
        const result = await res.json();

        if (!result.success) {
          showToast(result.message);
          return;
        }

        localStorage.setItem('admin_pin', adminPin);
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('adminCard').style.display = 'block';
        list.innerHTML = '';

        result.users.forEach(u => {
          const row = document.createElement('div');
          row.className = 'user-row';
          row.innerHTML = `
            <div class="user-info">
              <strong>@${u.username}</strong> (PIN: ${u.pin})
              <small>Tiket: ${u.tickets} | Reset Terakhir: ${u.lastDate}</small>
            </div>
            <div class="actions">
              <button class="btn-sm" onclick="setTicket('${u.username}', 10)">+10</button>
              <button class="btn-sm" onclick="setTicket('${u.username}', 0)">0</button>
            </div>
          `;
          list.appendChild(row);
        });
      } catch (e) {
        showToast('Koneksi database bermasalah.');
      }
    }

    window.setTicket = async function(targetUser, newTicket) {
      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'admin_set_ticket',
            adminPin,
            targetUser,
            newTicket
          })
        });
        const result = await res.json();
        showToast(result.message);
        if (result.success) loadUsers();
      } catch (e) {
        showToast('Gagal update tiket.');
      }
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }
  </script>
</body>
</html>
