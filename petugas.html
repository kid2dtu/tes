<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Petugas - Antrean Klinik</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        h2 { text-align: center; color: #333; }
        .aksi-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-refresh { background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-refresh:hover { background-color: #218838; }
        .btn-reset { background-color: #dc3545; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-reset:hover { background-color: #c82333; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #f2f2f2; }
        .btn-panggil { background-color: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-panggil:hover { background-color: #0056b3; }
        .status-tag { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .status-menunggu { background-color: #ffeeba; color: #856404; }
        .status-dipanggil { background-color: #cce5ff; color: #004085; }
        .text-selesai { color: #6c757d; font-style: italic; font-size: 14px; }
    </style>
</head>
<body>

    <h2>Dasbor Petugas Perawat</h2>
    
    <!-- Wadah Tombol Aksi -->
    <div class="aksi-bar">
        <button class="btn-refresh" id="btnRefresh">🔄 Segarkan Daftar</button>
        <button class="btn-reset" id="btnReset">⚠️ Reset Semua Antrean</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>No. Antrean</th>
                <th>Nama Pasien</th>
                <th>Poli Tujuan</th>
                <th>Status</th>
                <th>Tindakan</th>
            </tr>
        </thead>
        <tbody id="tabelAntrean">
            <tr>
                <td colspan="5">Memuat data antrean...</td>
            </tr>
        </tbody>
    </table>

    <div id="toast"></div>

    <script src="config.js"></script>
    <script>
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); toast.innerText = ""; }, 3000);
        }

        const headers = {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "Content-Type": "application/json"
        };

        async function muatAntrean() {
            const tbody = document.getElementById('tabelAntrean');
            
            try {
                const url = `${SUPABASE_URL}/rest/v1/antrean?order=id.asc`;
                const respon = await fetch(url, { method: "GET", headers: headers });
                
                if (!respon.ok) throw new Error(`Gagal terhubung ke database server (Status: ${respon.status})`);
                
                const daftarPasien = await respon.json();
                tbody.innerHTML = ""; 

                if (!daftarPasien || daftarPasien.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5">Tidak ada antrean pasien hari ini.</td></tr>`;
                    return;
                }

                daftarPasien.forEach(pasien => {
                    const statusClass = pasien.status === 'menunggu' ? 'status-menunggu' : 'status-dipanggil';
                    
                    const tombolAksi = pasien.status === 'menunggu' 
                        ? `<button class="btn-panggil" onclick="panggilPasien(${pasien.id}, this)">📢 Panggil</button>`
                        : `<span class="text-selesai">Selesai dipanggil</span>`;

                    const baris = `
                        <tr>
                            <td><strong>${pasien.nomor_antrean}</strong></td>
                            <td>${pasien.nama || '-'}</td>
                            <td>${pasien.poli || '-'}</td>
                            <td><span class="status-tag ${statusClass}">${pasien.status}</span></td>
                            <td>${tombolAksi}</td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', baris);
                });

            } catch (error) {
                console.error(error);
            }
        }

        async function panggilPasien(idPasien, btnElement) {
            const originalText = btnElement.innerText;
            btnElement.disabled = true;
            btnElement.innerText = "Memproses...";
            try {
                const url = `${SUPABASE_URL}/rest/v1/antrean?id=eq.${idPasien}`;
                const respon = await fetch(url, {
                    method: "PATCH", 
                    headers: headers,
                    body: JSON.stringify({ status: "dipanggil" })
                });

                if (!respon.ok) throw new Error(`Gagal mengubah data antrean (Status: ${respon.status})`);

                alert("Pasien berhasil dipanggil!");
                muatAntrean(); 

            } catch (error) {
                console.error(error);
                alert("Gagal memanggil pasien: " + error.message);
            }
        }

        // FUNGSI BARU: Untuk mengosongkan seluruh baris di tabel database Supabase
        async function resetSemuaAntrean() {
            const btnReset = document.getElementById('btnReset');
            const originalText = btnReset.innerText;
            btnReset.disabled = true;
            btnReset.innerText = "Memproses...";
            const konfirmasi = confirm("Apakah Anda yakin ingin MENGHAPUS SEMUA data antrean hari ini?\nTindakan ini tidak bisa dibatalkan dan nomor akan kembali dari angka 1.");
            
            if (!konfirmasi) return;

            try {
                // Menghapus data menggunakan filter ID yang lebih besar dari 0 (menghapus seluruh isi tabel)
                const url = `${SUPABASE_URL}/rest/v1/antrean?id=gt.0`;
                const respon = await fetch(url, {
                    method: "DELETE",
                    headers: headers
                });

                if (!respon.ok) throw new Error(`Gagal mengosongkan database (Status: ${respon.status})`);

                alert("Seluruh antrean klinik berhasil di-reset ke awal!");
                muatAntrean();

            } catch (error) {
                console.error(error);
                alert("Gagal mereset database: " + error.message);
            }
        }

        // Jalankan sinkronisasi background otomatis setiap 3 detik
        setInterval(muatAntrean, 3000);

        // Pasang event listener tombol pemicu fungsi
        document.getElementById('btnRefresh').addEventListener('click', muatAntrean);
        document.getElementById('btnReset').addEventListener('click', resetSemuaAntrean);
        window.addEventListener('DOMContentLoaded', muatAntrean);
    </script>
</body>
</html>
