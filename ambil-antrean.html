<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambil Antrean Klinik</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; text-align: center; }
        select, button { width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; cursor: pointer; }
        button { background-color: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .tiket { margin-top: 30px; padding: 20px; border: 2px dashed #333; display: none; background: #f9f9f9; }
        h1 { margin-bottom: 5px; }
    </style>
</head>
<body>

    <h2>Ambil Antrean</h2>
    
    <label for="nama">Nama Pasien:</label>
    <input type="text" id="nama" placeholder="Masukkan nama Anda" style="width: 93%; padding: 12px; margin: 10px 0; font-size: 16px;">

    <label for="poli">Pilih Poli Tujuan:</label>
    <select id="poli">
        <option value="Poli Umum">Poli Umum</option>
        <option value="Poli Gigi">Poli Gigi</option>
        <option value="Poli Anak">Poli Anak</option>
    </select>

    <button id="btnAmbil">Ambil Nomor Antrean</button>

    <div id="tiket" class="tiket">
        <h3>TIKET ANTREAN</h3>
        <p id="tiketPoli" style="font-weight: bold;"></p>
        <h1 id="tiketNomor" style="font-size: 48px; color: #007bff;">0</h1>
        <p id="tiketNama"></p>
        <small>Silahkan tunggu di ruang tunggu</small>
    </div>

    <button id="btnCetak" onclick="window.print()">Cetak Tiket</button>
    <div id="toast"></div>

    <script>
        // PERBAIKAN: Menggunakan URL asli proyek Supabase Anda kembali

        document.getElementById('btnAmbil').addEventListener('click', async () => {
            const btnAmbil = document.getElementById('btnAmbil');
            const originalText = btnAmbil.innerText;
            const namaInput = document.getElementById('nama').value.trim();
            const poliTerpilih = document.getElementById('poli').value;

            if (!namaInput) {
                showToast("Nama tidak boleh kosong!");
                return;
            }

            const headers = {
                "apikey": SUPABASE_ANON_KEY,
                "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                "Content-Type": "application/json"
            };

            try {
                let nomorBaru = 1;

                // 1. Mengambil nomor urut terakhir berdasarkan poli pilihan
                const urlFetch = `${SUPABASE_URL}/rest/v1/antrean?poli=eq.${encodeURIComponent(poliTerpilih)}&order=id.desc&limit=1`;
            btnAmbil.disabled = true;
            btnAmbil.innerText = "Memproses...";
                const responseFetch = await fetch(urlFetch, { method: "GET", headers: headers });

                if (!responseFetch.ok) {
                    throw new Error(`Gagal mengambil data antrean terakhir (Status: ${responseFetch.status})`);
                }

                const dataAntrean = await responseFetch.json();
                
                // PERBAIKAN: Membaca indeks array respon JSON [0] secara aman
                if (dataAntrean && dataAntrean.length > 0) {
                    nomorBaru = parseInt(dataAntrean[0].nomor_antrean) + 1;
                }

                // 2. Mengirim data antrean baru ke backend
                const urlInsert = `${SUPABASE_URL}/rest/v1/antrean`;
                const bodyData = {
                    nama: namaInput,
                    poli: poliTerpilih,
                    nomor_antrean: nomorBaru,
                    status: "menunggu"
                };

                const responseInsert = await fetch(urlInsert, {
                    method: "POST",
                    headers: headers,
                    body: JSON.stringify(bodyData)
                });

                if (!responseInsert.ok) {
                    throw new Error(`Gagal memasukkan data antrean baru (Status: ${responseInsert.status})`);
                }

                // 3. Merender tampilan tiket fisik ke layar monitor jika sukses
                document.getElementById('tiketPoli').innerText = poliTerpilih.toUpperCase();
                document.getElementById('tiketNomor').innerText = nomorBaru;
                document.getElementById('tiketNama').innerText = "Nama: " + namaInput;
                document.getElementById('tiket').style.display = 'block';
                
                document.getElementById('nama').value = "";
                alert("Antrean berhasil diambil!");

            } catch (error) {
                console.error(error);
                showToast(`Terjadi Kendala: ${error.message}\n\nJika tetap bermasalah, pastikan tabel 'antrean' Anda masih dalam status 'RLS disabled'.`);
            }
        });
    </script>
</body>
</html>
